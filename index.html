<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Junior & Taiane | Nosso Casamento</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<div class="container">

    <!-- TOPO -->
    <div class="info-topo">

        <div class="bloco-esquerdo">

            <div class="nome-data">
                <h1>Junior & Taiane</h1>
                <h2>16 de Agosto de 2027 às 16h</h2>
            </div>

        </div>

        <div class="bloco-direito">
            <p class="frase">
                "Cada história de amor é linda, mas a nossa é a minha favorita."
            </p>
        </div>

    </div>

    <!-- CONTADOR -->
    <div class="contador">

        <h3>Faltam para o nosso grande dia</h3>

        <div id="contador">

            <div class="tempo">
                <span id="dias">00</span>
                <p>Dias</p>
            </div>

            <div class="tempo">
                <span id="horas">00</span>
                <p>Horas</p>
            </div>

            <div class="tempo">
                <span id="minutos">00</span>
                <p>Minutos</p>
            </div>

            <div class="tempo">
                <span id="segundos">00</span>
                <p>Segundos</p>
            </div>

        </div>

    </div>

</div>

<script src="assets/js/script.js"></script>

</body>
</html>
